<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <style>
    .jacket-icon {
      fill: #0e3a7c;
      stroke: #0a2c5e;
      stroke-width: 2;
    }
    .stitching {
      fill: none;
      stroke: #be9c53;
      stroke-width: 1;
      stroke-dasharray: 2,1;
    }
  </style>
  
  <!-- Jacket outline -->
  <path class="jacket-icon" d="M30,20 L70,20 L80,30 L75,70 L70,80 L30,80 L25,70 L20,30 Z" />
  
  <!-- Jacket collar -->
  <path class="jacket-icon" d="M40,20 L40,40 L50,45 L60,40 L60,20" />
  
  <!-- Sleeves -->
  <path class="jacket-icon" d="M20,30 L10,50 M80,30 L90,50" />
  
  <!-- Stitching -->
  <path class="stitching" d="M50,45 L50,80" />
  <path class="stitching" d="M45,60 L55,60" />
</svg>
