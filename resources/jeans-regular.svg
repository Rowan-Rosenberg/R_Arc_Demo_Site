<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480">
  <defs>
    <linearGradient id="denim" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#3a5fa0"/>
      <stop offset="100%" stop-color="#1e3666"/>
    </linearGradient>
    <pattern id="twill" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="none"/>
      <path d="M-1,3 L3,-1 M3,7 L7,3" stroke="#4d6fb3" stroke-width="1" opacity="0.25"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="60" y="10" width="240" height="460" rx="18" fill="url(#denim)" filter="url(#shadow)"/>
  <rect x="60" y="10" width="240" height="460" rx="18" fill="url(#twill)" opacity="0.35"/>
  <!-- waistband -->
  <rect x="70" y="24" width="220" height="24" rx="8" fill="#21407d"/>
  <!-- fly -->
  <path d="M180 48 C188 96 188 180 180 244" fill="none" stroke="#d0a85f" stroke-width="3"/>
  <!-- side seams -->
  <path d="M70 60 L70 420" stroke="#d0a85f" stroke-width="3" stroke-dasharray="6 4"/>
  <path d="M290 60 L290 420" stroke="#d0a85f" stroke-width="3" stroke-dasharray="6 4"/>
  <!-- pockets -->
  <path d="M86 80 q40 -20 68 -18 v34 q-28 12 -68 6 z" fill="#2b4e8f" stroke="#d0a85f" stroke-width="3"/>
  <path d="M274 80 q-40 -20 -68 -18 v34 q28 12 68 6 z" fill="#2b4e8f" stroke="#d0a85f" stroke-width="3"/>
  <!-- coin pocket -->
  <rect x="222" y="88" width="34" height="20" rx="4" fill="#2b4e8f" stroke="#d0a85f" stroke-width="3"/>
  <!-- legs cut -->
  <path d="M180 250 L180 470" stroke="#d0a85f" stroke-width="3" stroke-dasharray="6 4"/>
  <!-- hem -->
  <rect x="70" y="430" width="80" height="18" fill="#234380"/>
  <rect x="210" y="430" width="80" height="18" fill="#234380"/>
</svg>